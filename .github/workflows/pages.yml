name: Validate and deploy Eric Cruz Operations
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operations-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install declared build and QA dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer poppler-utils fonts-crosextra-carlito
      - name: Generate dedicated Word and PDF resumes
        run: |
          python scripts/build-va-resume.py
          python scripts/build-va-pdf.py
      - name: Render Word for visual review
        run: python scripts/qa/render_docx.py downloads/Eric_John_Cruz_Virtual_Assistant_Resume.docx --output_dir qa-va/word --emit_pdf --dpi 120
      - name: Render published PDF for visual review
        run: |
          mkdir -p qa-va/pdf
          pdftoppm -r 120 -png downloads/Eric_John_Cruz_Virtual_Assistant_Resume.pdf qa-va/pdf/page
      - name: Check resume facts and formats
        run: |
          python scripts/check-va-resume.py --word-render qa-va/word
          python scripts/check-va-migration.py
      - name: Check responsive layouts accessibility navigation links and downloads
        run: node scripts/check-va-site.cjs
      - name: Stage public website files only
        run: python scripts/package-site.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: va-qa
          path: qa-va
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-site-files
          path: _site
          include-hidden-files: true
          retention-days: 30
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy validated website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  verify-live:
    needs: [build, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validated-site-files
          path: .published
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install browser QA dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          cp .published/downloads/Eric_John_Cruz_Virtual_Assistant_Resume.* downloads/
      - name: Wait for matching public homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen
          import time
          expected=Path('index.html').read_bytes()
          for attempt in range(24):
              try:
                  with urlopen('https://ericcruzoperations.github.io/?release='+str(time.time()),timeout=20) as r:
                      if r.read()==expected:
                          break
              except Exception:
                  pass
              time.sleep(10)
          else:
              raise SystemExit('Published homepage does not match this release')
          PY
      - name: Verify actual live pages assets and downloads
        run: node scripts/check-va-site.cjs --live
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: va-live-qa
          path: qa-va
          retention-days: 30
